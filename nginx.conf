map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Client body size limit for image uploads
    client_max_body_size 10M;

    # 1. index.html은 브라우저에 캐싱되지 않도록 처리 (배포 시 최신 JS 해시 자동 로드)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 2. 정적 에셋 (/assets/) 처리 (존재하지 않는 구버전 JS 파일 요청 시 HTML이 아닌 404 반환)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. React SPA 정적 파일 서빙 및 클라이언트 사이드 라우팅 지원
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO 웹소켓 역프록시 (WSS / HTTP 업그레이드 헤더 지원)
    location /socket.io/ {
        proxy_pass http://chat-server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API (이미지 업로드 등) 역프록시
    location /api/ {
        proxy_pass http://chat-server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 업로드 이미지 파일 서빙 역프록시
    location /uploads/ {
        proxy_pass http://chat-server:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
